name: Sync upstream & build Docker image

# Runs automatically every Monday at 08:00 UTC,
# or manually from the "Actions" tab (with a force option).
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force resync + rebuild even when already up to date'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Nereziel/cs2-WeaponPaints
  UPSTREAM_ASSET: WeaponPaints-Website.zip
  IMAGE: tripticon84/weaponpaints-website

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest upstream release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | jq -r '.tag_name')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::Unable to fetch the latest release tag of ${UPSTREAM_REPO}"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: ${tag}"

      - name: Compare with local version
        id: chk
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          current=$(cat .upstream-release 2>/dev/null || echo none)
          echo "Local: ${current} | Upstream: ${TAG} | force: ${FORCE:-false}"
          if [ "$current" = "$TAG" ] && [ "${FORCE:-}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Already up to date on ${TAG} — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and extract the archive
        if: steps.chk.outputs.skip == 'false'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp.zip \
            "https://github.com/${UPSTREAM_REPO}/releases/download/${TAG}/${UPSTREAM_ASSET}"
          mkdir -p /tmp/wp
          unzip -oq /tmp/wp.zip -d /tmp/wp
          test -f /tmp/wp/website/index.php || {
            echo "::error::Unexpected archive (website/index.php is missing)"; exit 1; }

      - name: Sync sources
        # --delete removes files dropped upstream; the --exclude entries protect
        # files owned by this repo (Dockerfile, compose, CI, state...) as well as
        # class/config.php, customized locally (reads environment variables).
        if: steps.chk.outputs.skip == 'false'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.dockerignore' \
            --exclude='.upstream-release' \
            --exclude='.env*' \
            --exclude='class/config.php' \
            --exclude='Dockerfile' \
            --exclude='docker-compose*.yml' \
            --exclude='README.md' \
            /tmp/wp/website/ ./
          printf '%s\n' "$TAG" > .upstream-release

      - name: Check upstream settings in class/config.php
        # class/config.php is never synced (see the excludes above), so warn when
        # upstream adds a new setting that is missing from the local version.
        if: steps.chk.outputs.skip == 'false'
        continue-on-error: true
        run: |
          set -uo pipefail
          upstream_defines=$(grep -oP "define\('\K[A-Z_]+" /tmp/wp/website/class/config.php 2>/dev/null | sort -u)
          local_defines=$(grep -oP "define\('\K[A-Z_]+" class/config.php 2>/dev/null | sort -u)
          missing=$(comm -23 <(printf '%s\n' "$upstream_defines") <(printf '%s\n' "$local_defines") | tr '\n' ' ')
          if [ -n "${missing// /}" ]; then
            echo "::warning::New upstream settings in class/config.php: ${missing}(add them to the local version)"
            {
              echo "### ⚠️ class/config.php: new upstream settings"
              echo ""
              echo '```'
              echo "${missing}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "class/config.php: no new upstream settings detected."
          fi

      - name: Setup Buildx
        if: steps.chk.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.chk.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The build runs BEFORE the commit: if the image cannot be published,
      # nothing is committed and the next run retries the sync.
      - name: Build and push the image
        if: steps.chk.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.rel.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit and push
        if: steps.chk.outputs.skip == 'false'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync upstream ${{ steps.rel.outputs.tag }}"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
